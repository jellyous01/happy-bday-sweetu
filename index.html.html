<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Happy Birthday, Naitik! 🎂</title>
<style>
  :root{
    --kraft-1:#c9a876;
    --kraft-2:#b8935f;
    --ink:#3a2c1e;
    --accent:#b3352c;
    --accent-2:#7a2420;
    --cream:#f3e9d6;
    --page-w: min(40vw, 400px);
    --page-h: calc(var(--page-w) * 1.294);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; min-height:100%;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color:var(--ink);
  }

  body{
    background-color:var(--kraft-1);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(0,0,0,0.10), transparent 45%),
      repeating-linear-gradient(0deg, rgba(120,90,50,0.05) 0px, rgba(120,90,50,0.05) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(120,90,50,0.04) 0px, rgba(120,90,50,0.04) 1px, transparent 1px, transparent 3px);
    background-blend-mode:multiply;
    min-height:100vh;
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:9vh;
    padding-bottom:6vh;
  }

  /* ---------- COVER ---------- */
  .cover-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    transition: opacity .5s ease, transform .6s cubic-bezier(.4,.1,.2,1);
  }
  .cover-wrap.hidden-away{
    opacity:0;
    transform:scale(.85) rotateY(-25deg);
    pointer-events:none;
    position:absolute;
  }

  .cover{
    width:min(80vw, 380px);
    cursor:pointer;
    border-radius:6px;
    box-shadow: 0 18px 40px rgba(30,15,5,0.45), 0 2px 0 rgba(255,255,255,0.15) inset;
    display:block;
    transform: rotate(-1deg);
    transition: transform .25s ease, box-shadow .25s ease;
    background: #eee2c4;
  }
  .cover:hover{ transform: rotate(-1deg) scale(1.015); box-shadow: 0 22px 46px rgba(30,15,5,0.5); }
  .cover:active{ transform: rotate(-1deg) scale(0.985); }

  .tap-hint{
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#4a3521;
    background:var(--cream);
    padding:8px 18px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }

  /* ---------- BOOK / SPREAD ---------- */
  .book{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .book.hidden{ display:none; }

  .back-btn{
    font-family:inherit;
    font-size:14px;
    background:var(--cream);
    color:var(--ink);
    border:none;
    padding:9px 16px;
    border-radius:18px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    margin-bottom:22px;
    letter-spacing:.03em;
  }
  .back-btn:hover{ filter:brightness(1.05); }
  .back-btn:active{ transform:translateY(1px); }

  .spread{
    display:flex;
    gap: 3.2%;
    width:min(90vw, 840px);
    justify-content:center;
    transform-origin:50% 50%;
    transform: scaleX(0.02);
    opacity:0;
    transition: transform .6s cubic-bezier(.2,.75,.25,1.05), opacity .35s ease;
  }
  .spread.open{
    transform: scaleX(1);
    opacity:1;
  }

  .page{
    width:var(--page-w);
    min-width:150px;
    background:var(--cream);
    border-radius:4px;
    box-shadow: 0 20px 45px rgba(20,10,5,0.4);
    padding:4.5%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .page.left-page{ transform: rotate(-0.6deg); }
  .page.right-page{ transform: rotate(0.6deg); overflow:hidden; }

  /* ---------- LEFT PAGE : envelope + letter ---------- */
  .envelope-scene{
    position:relative;
    width:100%;
    cursor:pointer;
  }
  .envelope-img{
    width:100%;
    display:block;
    border-radius:5px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
    transition: filter .4s ease;
  }
  .envelope-scene.open .envelope-img{ filter:brightness(.82) saturate(.9); }

  .letter-full{
    position:absolute;
    left:50%; top:50%;
    width:96%;
    border-radius:3px;
    box-shadow:0 6px 16px rgba(0,0,0,.22);
    transform: translate(-50%,-44%) scale(0.42) rotate(-3deg);
    opacity:0;
    transform-origin:50% 50%;
    transition: transform .55s cubic-bezier(.22,.85,.28,1), opacity .4s ease;
    pointer-events:none;
    z-index:2;
  }
  .envelope-scene.open .letter-full{
    transform: translate(-50%,-50%) scale(1) rotate(-0.4deg);
    opacity:1;
    pointer-events:auto;
    z-index:5;
  }

  .page-caption{
    margin-top:14px;
    font-size:12.5px;
    color:#6b5334;
    text-align:center;
    letter-spacing:.03em;
    font-style:italic;
  }

  /* ---------- RIGHT PAGE : candles ---------- */
  .cake-scene{
    position:relative;
    width:100%;
    line-height:0;
  }
  .cake-img{
    width:100%;
    display:block;
    border-radius:5px;
  }

  .flame{
    position:absolute;
    width:8.2%;
    transform-origin:50% 92%;
    transition: opacity .35s ease;
    will-change: transform;
  }
  .flame img{
    width:100%;
    display:block;
    filter: drop-shadow(0 0 6px rgba(255,170,40,.55));
  }
  .flame.idle{ animation: flicker 2.6s ease-in-out infinite; }
  .flame.out{ opacity:0; }
  @keyframes flicker{
    0%,100%{ transform: rotate(-1.5deg) scaleY(1); }
    25%{ transform: rotate(1.5deg) scaleY(1.03); }
    50%{ transform: rotate(-1deg) scaleY(0.98); }
    75%{ transform: rotate(2deg) scaleY(1.01); }
  }

  .smoke{
    position:absolute;
    width:5%;
    top:0;
    opacity:0;
    pointer-events:none;
  }
  .smoke.show{
    animation: smokeUp 1.4s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ opacity:.55; transform: translateY(0) scaleX(1); }
    100%{ opacity:0; transform: translateY(-38px) scaleX(1.8); }
  }

  /* ---------- mic meter + controls ---------- */
  .blow-controls{
    margin-top:16px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .meter-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    max-width:260px;
  }
  .meter-icon{ font-size:15px; flex-shrink:0; }
  .meter-track{
    flex:1;
    height:10px;
    background:rgba(0,0,0,.12);
    border-radius:6px;
    overflow:hidden;
    position:relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.25);
  }
  .meter-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #e8b23a, var(--accent));
    border-radius:6px;
    transition: width .06s linear;
  }
  .meter-threshold{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    background:rgba(60,30,10,.5);
    left:38%;
  }

  .status-text{
    font-size:11.5px;
    color:#6b5334;
    text-align:center;
    min-height:14px;
    letter-spacing:.02em;
  }

  .hold-btn{
    font-family:inherit;
    font-size:14px;
    background:var(--accent);
    color:#fff8ec;
    border:none;
    padding:11px 22px;
    border-radius:22px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(120,30,20,.4);
    letter-spacing:.02em;
    user-select:none;
    touch-action:manipulation;
  }
  .hold-btn:active, .hold-btn.blowing{
    background:var(--accent-2);
    transform:scale(.97);
    box-shadow:0 2px 6px rgba(120,30,20,.4);
  }

  .https-note{
    font-size:10.5px;
    color:#83654a;
    text-align:center;
    max-width:280px;
    line-height:1.4;
  }

  /* ---------- wish overlay ---------- */
  .wish-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    background:rgba(243,233,214,0.94);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
    border-radius:5px;
    padding:8%;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; }
  .wish-title{
    font-size: clamp(18px, 4.2vw, 26px);
    color:var(--accent-2);
    font-weight:bold;
    line-height:1.3;
  }
  .relight-btn{
    font-family:inherit;
    font-size:13.5px;
    background:var(--ink);
    color:#f3e9d6;
    border:none;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    top:-16px;
    width:8px; height:14px;
    opacity:.95;
    z-index:999;
    pointer-events:none;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); }
    100%{ transform: translateY(105vh) rotate(600deg); }
  }

  @media (max-width:640px){
    :root{ --page-w: min(43vw, 320px); }
    .spread{ gap:2.4%; }
    .page{ padding:4%; }
  }

  @media (prefers-reduced-motion: reduce){
    .tap-hint, .flame.idle{ animation:none; }
    .spread, .cover-wrap, .letter-full, .envelope-scene .envelope-img{ transition-duration:.01ms !important; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  // ---------- cover open / close ----------
  var coverWrap = document.getElementById('coverWrap');
  var coverImg = document.getElementById('coverImg');
  var book = document.getElementById('book');
  var spread = document.getElementById('spread');
  var backBtn = document.getElementById('backBtn');
  var micStarted = false;

  function openCard(){
    coverWrap.classList.add('hidden-away');
    book.classList.remove('hidden');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ spread.classList.add('open'); });
    });
    if(!micStarted){
      micStarted = true;
      initMic();
    }
  }

  function closeCard(){
    spread.classList.remove('open');
    coverWrap.classList.remove('hidden-away');
    setTimeout(function(){ book.classList.add('hidden'); }, 550);
    // tuck the letter back in and reset envelope visuals when leaving
    envelopeScene.classList.remove('open');
  }

  coverImg.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  // ---------- letter lift / tuck ----------
  var envelopeScene = document.getElementById('envelopeScene');
  var letterCaption = document.getElementById('letterCaption');
  envelopeScene.addEventListener('click', function(){
    var isOpen = envelopeScene.classList.toggle('open');
    letterCaption.textContent = isOpen ? 'tap to tuck it back in' : 'tap the letter to read it';
  });

  // ---------- candles ----------
  var FLAME_COUNT = 3;
  var flameEls = [document.getElementById('flame0'), document.getElementById('flame1'), document.getElementById('flame2')];
  var flameOut = [false, false, false];
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var statusText = document.getElementById('statusText');
  var meterFill = document.getElementById('meterFill');
  var holdBtn = document.getElementById('holdBtn');
  var httpsNote = document.getElementById('httpsNote');

  var BLOW_THRESHOLD = 0.16;   // level 0..1 above which we count it as "blowing"
  var EXTINGUISH_TIMES = [0.16, 0.32, 0.5]; // seconds of sustained blow to put out candle N
  var blowSeconds = 0;
  var lastFrameTime = null;
  var manualBlow = false;      // true while hold-button / spacebar is held
  var currentLevel = 0;        // 0..1 smoothed mic level, or 1 while manualBlow

  function allOut(){ return flameOut[0] && flameOut[1] && flameOut[2]; }

  function extinguishNext(){
    for(var i=0;i<FLAME_COUNT;i++){
      if(!flameOut[i]){
        flameOut[i] = true;
        var el = flameEls[i];
        el.classList.remove('idle');
        el.classList.add('out');
        spawnSmoke(el);
        return;
      }
    }
  }

  function spawnSmoke(flameEl){
    var puff = document.createElement('div');
    puff.className = 'smoke';
    puff.style.left = '30%';
    puff.textContent = '';
    puff.style.background = 'radial-gradient(circle, rgba(120,110,100,.55), transparent 70%)';
    puff.style.height = '30px';
    puff.style.borderRadius = '50%';
    flameEl.appendChild(puff);
    requestAnimationFrame(function(){ puff.classList.add('show'); });
    setTimeout(function(){ puff.remove(); }, 1500);
  }

  function resetCandles(){
    flameOut = [false, false, false];
    blowSeconds = 0;
    for(var i=0;i<FLAME_COUNT;i++){
      flameEls[i].classList.remove('out');
      flameEls[i].classList.add('idle');
      flameEls[i].style.transform = '';
    }
    wishOverlay.classList.remove('show');
    clearConfetti();
  }

  relightBtn.addEventListener('click', resetCandles);

  function showWishSoon(){
    setTimeout(function(){
      wishOverlay.classList.add('show');
      launchConfetti();
    }, 550);
  }

  // ---------- animation loop: bends flames + advances blow timer ----------
  function tick(ts){
    if(lastFrameTime === null) lastFrameTime = ts;
    var dt = (ts - lastFrameTime) / 1000;
    lastFrameTime = ts;
    if(dt > 0.2) dt = 0.2;

    var level = manualBlow ? 1 : currentLevel;
    meterFill.style.width = Math.min(100, Math.round(level*100)) + '%';

    var isBlowing = level > BLOW_THRESHOLD && !allOut();

    if(isBlowing){
      blowSeconds += dt;
      // bend not-yet-out flames sideways proportional to level
      for(var i=0;i<FLAME_COUNT;i++){
        if(!flameOut[i]){
          var lean = Math.min(1, level) * 34 + (Math.random()*6 - 3);
          flameEls[i].style.transform = 'rotate(' + lean.toFixed(1) + 'deg) scaleY(' + (1 - level*0.18).toFixed(2) + ')';
        }
      }
      var wasAllOutBefore = allOut();
      EXTINGUISH_TIMES.forEach(function(t, idx){
        if(blowSeconds >= t && !flameOut[idx]){
          extinguishNext();
        }
      });
      if(!wasAllOutBefore && allOut()){
        showWishSoon();
      }
    } else {
      blowSeconds = Math.max(0, blowSeconds - dt*1.5);
      for(var j=0;j<FLAME_COUNT;j++){
        if(!flameOut[j]) flameEls[j].style.transform = '';
      }
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- hold-to-blow fallback (button + spacebar) ----------
  function startManualBlow(){ manualBlow = true; holdBtn.classList.add('blowing'); }
  function stopManualBlow(){ manualBlow = false; holdBtn.classList.remove('blowing'); }

  holdBtn.addEventListener('mousedown', startManualBlow);
  holdBtn.addEventListener('touchstart', function(e){ e.preventDefault(); startManualBlow(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    holdBtn.addEventListener(ev, stopManualBlow);
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && !book.classList.contains('hidden')){
      e.preventDefault();
      startManualBlow();
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space') stopManualBlow();
  });

  // ---------- confetti ----------
  var confettiColors = ['#b3352c','#e8b23a','#7a2420','#f3e9d6','#8a9a5b','#c96f6f'];
  var confettiPieces = [];
  function launchConfetti(){
    clearConfetti();
    var n = 70;
    for(var i=0;i<n;i++){
      var el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random()*100) + 'vw';
      el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      var dur = 2.2 + Math.random()*1.6;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random()*0.4) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      confettiPieces.push(el);
      (function(elm, totalMs){
        setTimeout(function(){ elm.remove(); }, totalMs);
      })(el, (dur+0.4)*1000 + 200);
    }
  }
  function clearConfetti(){
    confettiPieces.forEach(function(el){ el.remove(); });
    confettiPieces = [];
  }

  // ---------- mic ----------
  var audioCtx = null, analyser = null, micSource = null, micTimeData = null;

  function setStatus(msg){ statusText.textContent = msg; }

  function initMic(){
    if(!window.isSecureContext){
      setStatus('mic needs https — use the button or hold spacebar');
      httpsNote.style.display = 'block';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('mic not supported here — use the button or hold spacebar');
      httpsNote.style.display = 'block';
      return;
    }
    setStatus('getting the mic ready…');
    navigator.mediaDevices.getUserMedia({audio:true, video:false})
      .then(function(stream){
        var AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        micSource = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.55;
        micTimeData = new Uint8Array(analyser.fftSize);
        micSource.connect(analyser);
        setStatus('mic ready — blow gently into it 💨');
        httpsNote.style.display = 'none';
        sampleMic();
      })
      .catch(function(err){
        setStatus('mic blocked — use the button or hold spacebar');
        httpsNote.style.display = 'block';
      });
  }

  function sampleMic(){
    if(!analyser) return;
    analyser.getByteTimeDomainData(micTimeData);
    var sumSquares = 0;
    for(var i=0;i<micTimeData.length;i++){
      var v = (micTimeData[i] - 128) / 128;
      sumSquares += v*v;
    }
    var rms = Math.sqrt(sumSquares / micTimeData.length);
    var target = Math.min(1, rms * 4.2);
    currentLevel = currentLevel + (target - currentLevel) * 0.5;
    requestAnimationFrame(sampleMic);
  }

})();
</script>
</body>
